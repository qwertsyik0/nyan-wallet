<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff6fa">
  <title>Nyan ID · Nyan Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./nyan_id.css?v=20261015-png3">
  <style>
    *{box-sizing:border-box}
    html{min-height:100%;background:#fff7fa}
    body{margin:0;padding:20px 16px 44px;min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#742d51;background:radial-gradient(circle at 90% 5%,#ffe0ec,transparent 40%),#fff7fa}
    .shell{max-width:460px;margin:0 auto}
    .shell-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
    .shell-brand{font-size:15px;font-weight:900;letter-spacing:-.04em}
    .shell-back{font-size:12px;font-weight:800;text-decoration:none;color:#9b5c7a;border-radius:12px;background:#fff;padding:10px 13px;border:1px solid #f0d5e2}
    .shell-kicker{font-size:11px;letter-spacing:.15em;font-weight:850;color:#ab7190}
    h1{font-size:clamp(36px,9vw,54px);line-height:1;letter-spacing:-.065em;margin:9px 0 13px}
    .shell-sub{font-size:13px;color:#96657d;line-height:1.6;margin:0 0 20px}
    #nyid-standalone-open{width:100%;padding:16px 20px;background:#8d315a;border:0;border-radius:17px;color:white;font:800 14px system-ui,-apple-system,sans-serif;box-shadow:0 12px 26px rgba(126,44,82,.15)}
    .shell-note{font-size:11px;line-height:1.5;margin-top:16px;color:#ac8195}
    .nyid-layer{z-index:100!important}
  </style>
</head>
<body>
  <main class="shell">
    <div class="shell-head">
      <span class="shell-brand">🐾 Nyan Wallet</span>
      <a class="shell-back" href="./index.html">На главную →</a>
    </div>
    <div class="shell-kicker">ПЕРСОНАЛЬНЫЙ ПРОПУСК</div>
    <h1>Твой Nyan ID</h1>
    <p class="shell-sub">Твоя карточка участника экосистемы Nyan. Ранг, достижения и дата регистрации — всё в одном месте.</p>
    <button id="nyid-standalone-open" type="button">Открыть мой Nyan ID</button>
    <p class="shell-note">Вся информация загружается из твоего кошелька. Открой страницу внутри Telegram, чтобы подтвердить аккаунт.</p>
  </main>
  <script src="./nyan_id.js?v=20261018-direct-https-v1"></script>
  <script>
    (() => {
      const begin = () => {
        const button = document.getElementById("nyid-standalone-open");
        button?.addEventListener("click", () => window.NyanID?.open?.());
        if (window.Telegram?.WebApp?.initData) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          window.NyanID?.open?.();
        }
      };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", begin, {once:true});
      else begin();
    })();
  </script>
</body>
</html>
