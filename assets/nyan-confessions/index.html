<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9fb">
  <meta name="description" content="Анонимные признания сообщества Nyan">
  <title>Nyan Confessions</title>
  <link rel="icon" href="/api/nyan-confessions/nyanik.webp" type="image/webp">
  <link rel="stylesheet" href="/api/nyan-confessions/style.css?v=4">
  <script src="/api/nyan-confessions/confessions.js?v=4" defer></script>
</head>
<body>
  <main class="app">
    <header class="intro">
      <div class="intro-copy">
        <h1>Nyan Confessions</h1>
        <p>Анонимные признания сообщества Nyan</p>
      </div>
      <img class="nyanik" src="/api/nyan-confessions/nyanik.webp" alt="" width="80" height="80">
    </header>

    <section id="weekly-question" class="weekly-question" aria-label="Вопрос недели" hidden>
      <strong>Вопрос недели</strong>
      <p id="weekly-question-text"></p>
    </section>

    <form id="confession-form" class="compose" method="post" aria-describedby="visibility">
      <label for="confession">Твоё признание</label>
      <p class="hint" id="visibility">Текст появится в ленте без имени.</p>
      <textarea id="confession" name="body" aria-describedby="count" rows="5" maxlength="1000" placeholder="О чём хочется рассказать?" required></textarea>
      <div class="count" id="count">0 / 1000</div>
      <button class="primary" type="submit" disabled>Опубликовать анонимно</button>
      <p id="submit-status" class="status" role="status"></p>
    </form>

    <p id="owner-status" class="status" data-state="error" role="status"></p>

    <details id="owner-tools" class="owner-tools" hidden>
      <summary>Управление Confessions</summary>
      <form id="question-form">
        <label for="question-input">Вопрос недели</label>
        <textarea id="question-input" rows="2" maxlength="180" placeholder="Пустой вопрос скрывает блок"></textarea>
        <button class="post-action" type="submit">Сохранить вопрос</button>
        <p class="status" role="status"></p>
      </form>
      <section class="moderation">
        <h2>Жалобы и скрытые записи</h2>
        <p id="moderation-status" class="status" role="status"></p>
        <div id="moderation-list"></div>
        <button id="moderation-more" class="post-action" type="button" hidden>Показать ещё</button>
      </section>
    </details>

    <section class="feed" aria-labelledby="feed-title">
      <h2 id="feed-title">Признания</h2>
      <p id="feed-status" class="feed-state" role="status" hidden></p>
      <noscript><p class="feed-state">Включи JavaScript, чтобы читать и публиковать признания.</p></noscript>
      <p id="shared-status" class="status" data-state="error" role="status"></p>
      <div id="posts" class="posts"></div>
      <button id="more" class="secondary" type="button" hidden>Показать ещё</button>
    </section>
  </main>
  <template id="post-interactions">
    <p class="post-pin" hidden>📌 Закреплено Квертом</p>
    <div class="post-actions">
      <div class="post-reactions" role="group" aria-label="Реакции">
        <button type="button" class="post-action" data-reaction="1" aria-pressed="false" aria-label="Лайк">
          <span aria-hidden="true">👍</span> <span data-count>0</span>
        </button>
        <button type="button" class="post-action" data-reaction="-1" aria-pressed="false" aria-label="Дизлайк">
          <span aria-hidden="true">👎</span> <span data-count>0</span>
        </button>
      </div>
      <button type="button" class="post-action owner-heart" aria-pressed="false"
        aria-label="Поставить сердечко от Кверта" hidden>🤍</button>
      <button type="button" class="post-action comments-toggle" aria-expanded="false">Комментировать</button>
      <button type="button" class="post-action share-post">Поделиться</button>
      <button type="button" class="post-action report-post">Пожаловаться</button>
      <button type="button" class="post-action pin-post" hidden>Закрепить</button>
      <button type="button" class="post-action hide-post" hidden>Скрыть</button>
    </div>
    <p class="owner-heart-badge" hidden>❤️ Понравилось Кверту</p>
    <p class="status owner-heart-status" data-state="error" role="status"></p>
    <p class="status post-action-status" role="status"></p>
    <p class="status reaction-status" data-state="error" role="status"></p>
    <div class="comments" hidden>
      <form class="comment-form" method="post">
        <div class="reply-preview" hidden>
          <p></p>
          <button class="post-action cancel-reply" type="button">Отменить ответ</button>
        </div>
        <textarea name="body" rows="2" maxlength="500" aria-label="Анонимный комментарий"
          placeholder="Написать анонимный комментарий" required></textarea>
        <button class="post-action comment-submit" type="submit">Отправить</button>
      </form>
      <p class="status comment-status" role="status"></p>
      <div class="comment-list"></div>
      <button class="post-action comments-more" type="button" hidden>Показать предыдущие</button>
    </div>
  </template>
</body>
</html>
