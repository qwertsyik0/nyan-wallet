name: Gift prize fulfilment checks
on:
  push:
    paths:
      - "tools/fulfil_gift_requests_20261122.py"
      - "tools/test_fulfil_gift_requests_20261122.py"
      - ".github/workflows/gift-prizes-check.yml"
  pull_request:
    paths:
      - "tools/fulfil_gift_requests_20261122.py"
      - "tools/test_fulfil_gift_requests_20261122.py"
      - ".github/workflows/gift-prizes-check.yml"
permissions:
  contents: read
jobs:
  gifts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install SQLAlchemy==2.0.43
      - run: python -m py_compile tools/fulfil_gift_requests_20261122.py
      - run: python tools/test_fulfil_gift_requests_20261122.py
