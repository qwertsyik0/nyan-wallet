name: Backend syntax check

on:
  push:
    branches: [main]
    paths:
      - "server/**/*.py"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pycompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile backend modules
        run: python -m py_compile server/*.py
      - name: Check browser JavaScript syntax
        run: |
          for file in ./*.js; do
            node --check "$file"
          done
