name: Backend and client syntax check

on:
  push:
    branches: [main, 'ui/visible-compact-polish-20261016']
    paths:
      - "server/**/*.py"
      - "*.js"
      - "tools/install_giveaway_bot.py"
      - "tools/nyan_bot_autodeploy.py"
      - "tools/test_finance_workspace.py"
      - "bot_addons/giveaway_bot.py.gz.b64"
      - "bot_addons/maintenance_bot.py"
      - "bot_addons/broadcast_bot.py"
      - "bot_addons/channel_publish_bot.py"
      - "bot_addons/channel_publish_bot_v2.py"
      - "index.html"
      - "bot_addons/ban_bot.py"
      - "tools/install_broadcast_bot.py"
      - "tools/install_channel_publish_bot.py"
      - "tools/install_ban_bot.py"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile backend and installer
        run: python -m py_compile server/*.py tools/install_giveaway_bot.py tools/install_maintenance_bot.py tools/install_broadcast_bot.py tools/install_channel_publish_bot.py tools/install_ban_bot.py bot_addons/broadcast_bot.py bot_addons/channel_publish_bot.py bot_addons/channel_publish_bot_v2.py bot_addons/ban_bot.py tools/nyan_bot_autodeploy.py
      - name: Test Nyan ID PNG export and Telegram document upload
        run: python tools/test_nyan_id_png.py
      - name: Test finance internship role and approval workflow
        run: |
          python -m pip install -r requirements.txt
          python tools/test_finance_workspace.py
      - name: Check VPS auto-deploy entry point
        run: python tools/nyan_bot_autodeploy.py --help
      - name: Validate giveaway bot payload
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path
          encoded = Path("bot_addons/giveaway_bot.py.gz.b64").read_bytes()
          assert hashlib.sha256(encoded).hexdigest() == "d1ab94e7703e1fb5ba467586d54a02a5b3c56d382d1d49cc54b3c3ce9540800a"
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(source).hexdigest() == "b2c8fc0749bc0066509828c6b2f0fde92542a772ae9d68d2e8350b55e6567c98"
          compile(source.decode("utf-8"), "giveaway_bot.py", "exec")
          print("giveaway_bot payload OK")
          PY
      - name: Audit giveaway bot feature markers
        run: |
          python - <<'PY'
          import ast, base64, gzip
          from pathlib import Path
          src = gzip.decompress(base64.b64decode(Path("bot_addons/giveaway_bot.py.gz.b64").read_bytes(), validate=True)).decode("utf-8")
          tree = ast.parse(src)
          names = sorted({
              node.name for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and any(key in node.name.lower() for key in ("give", "channel", "media", "result", "winner", "preview", "wizard", "cancel"))
          })
          print("FUNCTIONS:", " | ".join(names))
          for no, line in enumerate(src.splitlines(), 1):
              low = line.lower()
              if any(key in low for key in (
                  "chatmemberhandler", "my_chat_member", "media_group_id", "copy_message",
                  "preview", "предпросмотр", "album", "альбом", "custom_emoji",
                  "nyg:", "nygo:", "nygw:", "results/publish", "replace-post"
              )):
                  print(f"{no}: {line}")
          PY
      - name: Test installer patch safety
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("installer", Path("tools/install_giveaway_bot.py"))
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          source = "from telegram.ext import Application\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\ndef main():\n    app = Application.builder().token('x').build()\n    app.run_polling(drop_pending_updates=True)\n\nif __name__ == '__main__':\n    main()\n"
          patched = module.patch_bot(source)
          assert patched.count("from giveaway_bot import register_giveaway_handlers") == 1
          assert patched.count("register_giveaway_handlers(app)") == 1
          assert patched.index("register_giveaway_handlers(app)") < patched.index("app.run_polling")
          assert module.patch_bot(patched) == patched

          import base64, gzip
          encoded = Path("bot_addons/giveaway_bot.py.gz.b64").read_bytes()
          raw_bot = gzip.decompress(base64.b64decode(encoded, validate=True))
          adapted = module.adapt_giveaway_source(raw_bot).decode("utf-8")
          assert "value > 1000" in adapted
          assert "1 <= value <= 1000" in adapted
          assert "0 <= value <= 1000" in adapted
          assert "Лимит должен быть от 1 до 10." not in adapted
          assert "Бонусных билетов: от 0 до 9." not in adapted
          assert 'state["post"] = {"source_chat_id": _owner_id(), "message_ids": copied_ids}' not in adapted
          assert "Keep the owner's original message as the canonical publication source." in adapted
          assert 'if data.startswith("nyg:buy:"):' in adapted
          assert '"web_app": {"url": web_url}' in adapted
          assert "Кнопка покупки отправлена в личные сообщения." in adapted
          compile(adapted, "giveaway_bot.py", "exec")
          print("installer patch, ticket limits, premium emoji and ticket handoff adaptation OK")
          PY
      - name: Audit appeals subsystem
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("server/appeals.py").read_text(encoding="utf-8")
          compile(source, "server/appeals.py", "exec")
          required = [
              'UniqueConstraint("topic_id", "telegram_id"',
              'MAX_SKIN_IMAGE_BYTES = 2 * 1024 * 1024',
              'def detect_image_mime',
              'async def read_limited_image',
              'def assign_skin_to_user',
              '@router.post("/api/appeals")',
              '@router.post("/api/owner/appeals/{appeal_id}/assign-skin")',
              '@router.post("/api/owner/appeals/{appeal_id}/wallet-skin")',
              '@router.post("/api/wallet-skins/activate-default")',
              '@router.get("/api/wallet-skins/{skin_id}/image")',
              'safe_owner_notification',
              'AppealStatusHistory',
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"appeals subsystem markers missing: {missing}"
          client = Path("appeals.js").read_text(encoding="utf-8")
          for marker in (
              "Обращения",
              "uploadIndividualSkin",
              "assignSelectedTemplate",
              "activateDefaultSkin",
              "loadMySkins",
              "ownerAppeal",
              'params.get("appeal")',
          ):
              assert marker in client, f"appeals client marker missing: {marker}"
          print("appeals subsystem static audit OK")
          PY
      - name: Audit transfer subsystem
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("server/transfers.py").read_text(encoding="utf-8")
          compile(source, "server/transfers.py", "exec")
          required = [
              'UniqueConstraint("sender_id", "idempotency_key"',
              '.with_for_update()',
              '@router.post("/api/transfers")',
              '@router.get("/api/transfers/recipient")',
              '@router.get("/api/wallet/qr")',
              'MAX_TRANSFER_DAILY',
              'IDEMPOTENCY_RE',
              'transfer_out',
              'transfer_in',
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"transfer subsystem markers missing: {missing}"
          client = Path("transfer.js").read_text(encoding="utf-8")
          for marker in (
              "pendingIdempotencyKey",
              "resolveRecipient",
              "sendTransfer",
              "openQr",
              "pay_",
          ):
              assert marker in client, f"transfer client marker missing: {marker}"
          print("transfer subsystem static audit OK")
          PY
      - name: Audit maintenance subsystem
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("server/maintenance.py").read_text(encoding="utf-8")
          compile(source, "server/maintenance.py", "exec")
          for marker in (
              'class MaintenanceState',
              '@router.get("/api/maintenance/status")',
              '@router.post("/api/internal/maintenance/toggle")',
              'verify_internal_signature',
              'maintenance_guard',
              'core.is_owner',
              'Retry-After',
          ):
              assert marker in source, f"maintenance backend marker missing: {marker}"

          client = Path("maintenance.js").read_text(encoding="utf-8")
          for marker in (
              "showMaintenance",
              "__nyanMaintenanceBlocked",
              "/api/maintenance/status",
              "maintenance-retry",
          ):
              assert marker in client, f"maintenance client marker missing: {marker}"

          bot = Path("bot_addons/maintenance_bot.py").read_text(encoding="utf-8")
          compile(bot, "bot_addons/maintenance_bot.py", "exec")
          for marker in (
              'CommandHandler("maintenance"',
              "signed_request",
              "OWNER_TELEGRAM_ID",
              "/api/internal/maintenance/toggle",
          ):
              assert marker in bot, f"maintenance bot marker missing: {marker}"
          print("maintenance subsystem static audit OK")
          PY
      - name: Audit broadcast subsystem
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path("server/broadcast.py").read_text(encoding="utf-8")
          compile(backend, "server/broadcast.py", "exec")
          for marker in (
              '@router.post("/api/internal/broadcast/recipients")',
              'verify_internal_signature',
              'active_7d',
              'active_30d',
              'core.User.last_seen_at',
          ):
              assert marker in backend, f"broadcast backend marker missing: {marker}"

          bot = Path("bot_addons/broadcast_bot.py").read_text(encoding="utf-8")
          compile(bot, "bot_addons/broadcast_bot.py", "exec")
          for marker in (
              'CommandHandler("broadcast"',
              'CommandHandler("broadcast_templates"',
              'CommandHandler("broadcast_scheduled"',
              'CommandHandler("broadcast_cancel"',
              'copy_message',
              'copy_messages',
              'WebAppInfo',
              'RetryAfter',
              'Premium custom emoji',
              '/api/internal/broadcast/recipients',
              'broadcast_state.json',
              '_scheduler_loop',
              '_save_template',
              '_save_schedule',
              'MOSCOW_TZ',
              'BotCommandScopeChat',
              '_ensure_owner_command_menu',
          ):
              assert marker in bot, f"broadcast bot marker missing: {marker}"

          v2 = Path("bot_addons/channel_publish_bot_v2.py").read_text(encoding="utf-8")
          compile(v2, "bot_addons/channel_publish_bot_v2.py", "exec")
          assert 'return "suggestion_300"' in v2, "suggestion-300 must map to Telegram Mini App start parameter"
          assert 'return "finance_admin"' in v2, "finance-apply.html must open via Telegram Mini App"
          assert 'return "finance_review"' in v2, "finance-review.html must open via Telegram Mini App"
          assert 'url=_mini_app_deep_link(spec.url, bot_username)' in v2, "Mini App must use Telegram link"
          main_html = Path("index.html").read_text(encoding="utf-8")
          assert 'startParam === "suggestion_300"' in main_html, "suggestion-300 app route missing"
          assert 'new URL("./suggestion-300.html", window.location.href)' in main_html, "suggestion page redirect missing"
          for marker in (
              'url=_mini_app_deep_link(spec.url, bot_username)',
              'https://t.me/',
              'startapp=',
              'promo:',
              'wallet',
          ):
              assert marker in v2, f"channel publisher v2 marker missing: {marker}"
          assert 'url=spec.url)\n        else:' not in v2.split('def _post_markup', 1)[1].split('def _menu_text', 1)[0], "Mini App must not use raw host URL"

          channel = Path("bot_addons/channel_publish_bot.py").read_text(encoding="utf-8")
          compile(channel, "bot_addons/channel_publish_bot.py", "exec")
          assert '"finance_admin"' in channel and '"finance_review"' in channel, "legacy channel publisher must support finance Mini App routes"
          assert '"/finance-apply.html"' in channel, "legacy channel publisher form route missing"
          assert '"/finance-review.html"' in channel, "legacy channel publisher review route missing"
          for marker in (
              'CommandHandler("channel_post"',
              'TELEGRAM_CHANNEL_ID',
              'copy_message',
              'copy_messages',
              'confirm_publish',
              'promo:nyan109',
              'startapp=',
              'promo_',
              '_channel_markup',
              'Forbidden',
              'BadRequest',
          ):
              assert marker in channel, f"channel publisher marker missing: {marker}"

          installer = Path("tools/install_broadcast_bot.py").read_text(encoding="utf-8")
          compile(installer, "tools/install_broadcast_bot.py", "exec")
          channel_installer = Path("tools/install_channel_publish_bot.py").read_text(encoding="utf-8")
          compile(channel_installer, "tools/install_channel_publish_bot.py", "exec")
          print("broadcast and channel publisher static audit OK")
          PY
      - name: Audit user ban subsystem
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path("server/user_bans.py").read_text(encoding="utf-8")
          compile(backend, "server/user_bans.py", "exec")
          for marker in (
              'class BlockedUser',
              '@router.post("/api/owner/bans/ban")',
              '@router.post("/api/owner/bans/unban")',
              '@router.post("/api/internal/user-ban")',
              'blocked_user_guard',
              'Владельца Nyan Wallet нельзя заблокировать',
          ):
              assert marker in backend, f"user ban backend marker missing: {marker}"

          bot = Path("bot_addons/ban_bot.py").read_text(encoding="utf-8")
          compile(bot, "bot_addons/ban_bot.py", "exec")
          for marker in (
              'CommandHandler("ban"',
              'CommandHandler("unban"',
              '/api/internal/user-ban',
              '/api/internal/user-ban/status',
              'signed_action',
              'signed_status',
              'blocked_message_guard',
              'blocked_callback_guard',
          ):
              assert marker in bot, f"user ban bot marker missing: {marker}"

          installer = Path("tools/install_ban_bot.py").read_text(encoding="utf-8")
          compile(installer, "tools/install_ban_bot.py", "exec")
          notice = Path("ban_notice.js").read_text(encoding="utf-8")
          for marker in (
              "/api/ban/status",
              "Аккаунт заблокирован",
              "Обжаловать решение",
              "tg://user?id=",
          ):
              assert marker in notice, f"ban notice marker missing: {marker}"
          print("user ban subsystem static audit OK")
          PY
      - name: Audit delayed-fee promo subsystem
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path("server/promo_delayed_fee.py").read_text(encoding="utf-8")
          compile(backend, "server/promo_delayed_fee.py", "exec")
          for marker in (
              'PROMO_CODE = "NYAN300"',
              'FEE_PERCENT = 10',
              'FEE_DELAY = timedelta(hours=1)',
              '@router.post("/api/promo/nyan300/redeem")',
              'accepted_terms',
              'promo_delayed_fee',
              'process_due_fees',
          ):
              assert marker in backend, f"delayed promo backend marker missing: {marker}"

          campaign = Path("server/campaign_promos.py").read_text(encoding="utf-8")
          assert '"code": "NYAN300"' in campaign
          assert '"reward_amount": 300' in campaign
          assert '"max_uses": 30' in campaign

          html = Path("promo-300.html").read_text(encoding="utf-8")
          for marker in (
              "300 лапкоинов",
              "30 активаций",
              "10% от текущего баланса",
              "Я понимаю и принимаю",
          ):
              assert marker in html, f"promo page marker missing: {marker}"
          print("delayed-fee promo subsystem static audit OK")
          PY
      - name: Audit achievements subsystem
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path("server/achievements.py").read_text(encoding="utf-8")
          compile(backend, "server/achievements.py", "exec")
          for marker in (
              '"key": "ten_thousand"',
              '"key": "promo_hunter"',
              '"key": "promo_master"',
              '"key": "reward_collector"',
              '"key": "veteran"',
              '"key": "achievement_hunter"',
              '"key": "achievement_master"',
              '"key": "secret_zero"',
              '"key": "secret_777"',
              '"key": "secret_1000"',
              '"key": "completionist"',
              '"rarity": "mythic"',
              '"comparison": "eq"',
              '"transfer_in"',
              'def _achievement_target',
              'def _achievement_current',
              'def _achievement_met',
              '"title": "???"',
              '"description": "Секретное достижение"',
          ):
              assert marker in backend, f"achievement backend marker missing: {marker}"

          client = Path("achievements.js").read_text(encoding="utf-8")
          for marker in (
              "mystery:",
              'mythic: "Мифическое"',
              "secretLocked",
              "условие скрыто",
              'data-rarity="',
          ):
              assert marker in client, f"achievement client marker missing: {marker}"

          html = Path("index.html").read_text(encoding="utf-8")
          assert "achievements.js?v=20261006-1" in html
          print("achievements subsystem static audit OK")
          PY
      - name: Audit owner antifraud and risk scoring
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          api = Path("server/antifraud.py").read_text(encoding="utf-8")
          tree = ast.parse(api)
          assert 'core.require_owner(tg)' in api, "Antifraud must be owner-only"
          assert '@router.get("/api/owner/antifraud/cases")' in api
          assert '@router.get("/api/owner/antifraud/pair/{sender_id}/{recipient_id}")' in api
          assert '@router.get("/api/owner/antifraud/lookup")' in api
          assert 'SCAN_LIMIT = 1500' in api
          assert 'select(WalletTransfer)' in api
          assert 'select(Referral)' in api
          assert 'core.PromoRedemption' in api
          assert 'BlockedUser.telegram_id' in api
          assert not any(danger in api for danger in [
              'session.add(', 'session.delete(', 'session.commit(', 'session.flush(',
              '.balance +=', '.balance -=',
          ]), "Antifraud must be read-only"

          risk = next(node for node in tree.body
                      if isinstance(node, ast.FunctionDef) and node.name == "risk_for")
          scope = {}
          exec(compile(ast.Module(body=[risk], type_ignores=[]), "risk_for", "exec"), scope)
          classify = scope["risk_for"]
          assert classify(linked=True, promo_count=5, amount=700, senders_to_recipient=1) == (7, "high")
          assert classify(linked=True, promo_count=0, amount=20, senders_to_recipient=1) == (4, "medium")
          assert classify(linked=False, promo_count=1, amount=700, senders_to_recipient=1)[1] == "low"

          app = Path("server/__init__.py").read_text(encoding="utf-8")
          assert "register_antifraud(backend_app.app)" in app
          assert app.index("register_transfers(backend_app.app)") < app.index("register_antifraud(backend_app.app)")
          html = Path("index.html").read_text(encoding="utf-8")
          assert "antifraud.css?v=20261014-1" in html
          assert "antifraud.js?v=20261014-1" in html
          assert html.index("app.js?v=") < html.index("antifraud.js?v=")
          ui = Path("antifraud.js").read_text(encoding="utf-8")
          for item in ("nyan-owner-state", "antifraud/cases", "antifraud/lookup",
                       "nyan-af-detail", "Никаких автоматических"):
              assert item in ui, item
          print("Owner-only antifraud scan, pair lookup, safe scoring and UI OK")
          PY
      - name: Audit financial recruitment submission and owner review
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("server/finance_recruitment.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          for marker in (
              'class FinancialAdminApplication(core.Base):',
              'UniqueConstraint("telegram_id", name="uq_fin_admin_applicant")',
              'core.verify_init_data(x_telegram_init_data or "")',
              'core.require_owner(user)',
              '@router.post("/api/recruitment/finance/apply", status_code=201)',
              '@router.get("/api/recruitment/finance/me")',
              '@router.get("/api/owner/recruitment/finance")',
              '@router.post("/api/owner/recruitment/finance/{application_id}/review")',
              'FinancialAdminApplication.__table__.create(bind=core.engine, checkfirst=True)',
          ):
              assert marker in source, "Finance recruitment marker missing: " + marker
          # Hiring decisions never grant wallet admin powers or manipulate balances.
          for forbidden in ('user.balance +=', 'user.balance -=', 'BOT_TOKEN =', 'update_parental_control', 'ADMIN_ROLE ='):
              assert forbidden not in source
          assert 'Literal[True]' in source and "with_for_update()" in source
          assert source.count('core.require_owner(user)') == 2
          init = Path("server/__init__.py").read_text(encoding="utf-8")
          assert "register_finance_recruitment(backend_app.app)" in init
          index = Path("index.html").read_text(encoding="utf-8")
          assert '"finance_admin"' in index and './finance-apply.html' in index
          for name in ("finance-apply", "finance-review"):
              html = Path(name + ".html").read_text(encoding="utf-8")
              js = Path(name + ".js").read_text(encoding="utf-8")
              assert name + ".js?v=" in html
              assert 'X-Telegram-Init-Data' in js
              assert 'nyan-wallet-api.onrender.com' in js
          print("Financial recruitment routes, Telegram auth and owner-only review OK")
          PY
      - name: Verify info-channel subscription is optional
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("server/backend_app.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          check = next(node for node in ast.walk(tree)
                       if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                       and node.name == "verify_init_data")
          default = next((d.value for d in check.args.kw_defaults
                          if isinstance(d, ast.Constant) and isinstance(d.value, bool)), None)
          assert default is False, "Main API authentication should not require channel subscription"
          assert 'if require_subscription:' in source, "Keep explicit subscription gate for opt-in use cases"
          client = Path("app.js").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")
          for forbidden in ("showSubscriptionGate", "checkRequiredSubscription", "__nyanSubscriptionBlocked"):
              assert forbidden not in client, forbidden
          assert 'id="subscription-view"' not in html
          assert "app.js?v=20261015-no-subscribe" in html
          print("Wallet opens without channel membership; Telegram signature verification retained")
          PY
      - name: Check browser JavaScript syntax
        run: |
          for file in ./*.js; do
            node --check "$file"
          done
