name: Backend and client syntax check

on:
  push:
    branches: [main]
    paths:
      - "server/**/*.py"
      - "*.js"
      - "tools/install_giveaway_bot.py"
      - "bot_addons/giveaway_bot.py.gz.b64"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile backend and installer
        run: python -m py_compile server/*.py tools/install_giveaway_bot.py
      - name: Validate giveaway bot payload
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path
          encoded = Path("bot_addons/giveaway_bot.py.gz.b64").read_bytes()
          assert hashlib.sha256(encoded).hexdigest() == "d1ab94e7703e1fb5ba467586d54a02a5b3c56d382d1d49cc54b3c3ce9540800a"
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(source).hexdigest() == "b2c8fc0749bc0066509828c6b2f0fde92542a772ae9d68d2e8350b55e6567c98"
          compile(source.decode("utf-8"), "giveaway_bot.py", "exec")
          print("giveaway_bot payload OK")
          PY
      - name: Audit giveaway bot feature markers
        run: |
          python - <<'PY'
          import ast, base64, gzip
          from pathlib import Path
          src = gzip.decompress(base64.b64decode(Path("bot_addons/giveaway_bot.py.gz.b64").read_bytes(), validate=True)).decode("utf-8")
          tree = ast.parse(src)
          names = sorted({
              node.name for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and any(key in node.name.lower() for key in ("give", "channel", "media", "result", "winner", "preview", "wizard", "cancel"))
          })
          print("FUNCTIONS:", " | ".join(names))
          for no, line in enumerate(src.splitlines(), 1):
              low = line.lower()
              if any(key in low for key in (
                  "chatmemberhandler", "my_chat_member", "media_group_id", "copy_message",
                  "preview", "предпросмотр", "album", "альбом", "custom_emoji",
                  "nyg:", "nygo:", "nygw:", "results/publish", "replace-post"
              )):
                  print(f"{no}: {line}")
          PY
      - name: Inspect custom emoji preview flow
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          src = gzip.decompress(base64.b64decode(Path("bot_addons/giveaway_bot.py.gz.b64").read_bytes(), validate=True)).decode("utf-8")
          lines = src.splitlines()
          for no in range(640, min(790, len(lines)) + 1):
              print(f"{no}: {lines[no - 1]}")
          PY
      - name: Test installer patch safety
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("installer", Path("tools/install_giveaway_bot.py"))
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          source = "from telegram.ext import Application\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\ndef main():\n    app = Application.builder().token('x').build()\n    app.run_polling(drop_pending_updates=True)\n\nif __name__ == '__main__':\n    main()\n"
          patched = module.patch_bot(source)
          assert patched.count("from giveaway_bot import register_giveaway_handlers") == 1
          assert patched.count("register_giveaway_handlers(app)") == 1
          assert patched.index("register_giveaway_handlers(app)") < patched.index("app.run_polling")
          assert module.patch_bot(patched) == patched

          import base64, gzip
          encoded = Path("bot_addons/giveaway_bot.py.gz.b64").read_bytes()
          raw_bot = gzip.decompress(base64.b64decode(encoded, validate=True))
          adapted = module.adapt_giveaway_source(raw_bot).decode("utf-8")
          assert "value > 1000" in adapted
          assert "1 <= value <= 1000" in adapted
          assert "0 <= value <= 1000" in adapted
          assert "Лимит должен быть от 1 до 10." not in adapted
          assert "Бонусных билетов: от 0 до 9." not in adapted
          compile(adapted, "giveaway_bot.py", "exec")
          print("installer patch and ticket-limit adaptation OK")
          PY
      - name: Check browser JavaScript syntax
        run: |
          for file in ./*.js; do
            node --check "$file"
          done
