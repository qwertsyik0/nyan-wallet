name: Custom gift voucher checks
on:
  push:
    paths:
      - "tools/grant_custom_gift_coupon.py"
      - "tools/test_grant_custom_gift_coupon.py"
      - ".github/workflows/custom-voucher-check.yml"
  pull_request:
    paths:
      - "tools/grant_custom_gift_coupon.py"
      - "tools/test_grant_custom_gift_coupon.py"
      - ".github/workflows/custom-voucher-check.yml"
permissions:
  contents: read
jobs:
  voucher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install SQLAlchemy==2.0.43
      - run: python -m py_compile tools/grant_custom_gift_coupon.py
      - run: python tools/test_grant_custom_gift_coupon.py
