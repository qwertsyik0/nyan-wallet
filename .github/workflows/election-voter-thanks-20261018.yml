name: One-time Nyan Elections thank-you letters (2026-10-18)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/election-voter-thanks-20261018.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyan-election-voter-thanks-20261018
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify protected deployment secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BOT_TOKEN" ]; then
            echo "STOP: protected DATABASE_URL and/or BOT_TOKEN are not configured in GitHub Actions."
            exit 2
          fi
      - name: Install only the PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.3.5"
      - name: Compile one-time script
        run: python -m py_compile tools/send_election_voter_letters_20261018.py
      - name: Send 39 personal thank-you letters once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python tools/send_election_voter_letters_20261018.py --send
