name: One-time Nyan Elections thank-you letters (2026-10-18)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/election-voter-thanks-20261018.yml"
      - "tools/send_election_voter_letters_20261018.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyan-election-voter-thanks-20261018
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and check personalised letter formatting
        run: |
          python -m py_compile tools/send_election_voter_letters_20261018.py
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("letters", "tools/send_election_voter_letters_20261018.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          text = module.render_letter(123, "<Иван>", "&Мария")
          assert 'tg://user?id=123' in text
          assert '&lt;Иван&gt;' in text
          assert '&amp;Мария' in text
          assert '200 🐾' in text
          print("Letter HTML and syntax OK")
          PY
      - name: Verify protected deployment secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BOT_TOKEN" ]; then
            echo "STOP: protected DATABASE_URL and/or BOT_TOKEN are not configured in GitHub Actions."
            exit 2
          fi
      - name: Install only the PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.3.5" "pg8000==1.31.5"
      - name: Probe PostgreSQL TLS negotiation without database credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, socket, struct, ssl
          from urllib.parse import urlsplit
          u = urlsplit(os.environ["DATABASE_URL"])
          host, port = u.hostname, u.port or 5432
          try:
              with socket.create_connection((host, port), timeout=7) as sock:
                  print("TCP: connected")
                  sock.settimeout(7)
                  sock.sendall(struct.pack("!II", 8, 80877103))
                  first = sock.recv(1)
                  print("PG_SSL_REQUEST_REPLY:", "TLS_SUPPORTED" if first == b"S" else "NO_TLS" if first == b"N" else "CONNECTION_CLOSED" if not first else "OTHER")
                  if first == b"S":
                      with ssl.create_default_context().wrap_socket(sock, server_hostname=host) as secure:
                          print("TLS:", secure.version(), "handshake_ok")
                          from urllib.parse import unquote
                          user = unquote(u.username or "")
                          database = unquote(u.path.lstrip("/"))
                          payload = struct.pack("!I", 196608) + b"user\\0" + user.encode() + b"\\0database\\0" + database.encode() + b"\\0\\0"
                          secure.sendall(struct.pack("!I", len(payload) + 4) + payload)
                          greeting = secure.recv(1)
                          print("PG_STARTUP_REPLY:", {b"R":"AUTH_REQUEST", b"E":"ERROR_RESPONSE", b"": "CONNECTION_CLOSED"}.get(greeting, "OTHER"))
          except Exception as exc:
              print("PROBE_EXCEPTION:", type(exc).__name__)
          PY
      - name: Probe pure-Python PostgreSQL client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, ssl
          from urllib.parse import urlsplit, unquote
          import pg8000.dbapi
          u = urlsplit(os.environ["DATABASE_URL"])
          try:
              conn = pg8000.dbapi.connect(
                  host=u.hostname, port=u.port or 5432,
                  user=unquote(u.username or ""),
                  password=unquote(u.password or ""),
                  database=unquote(u.path.lstrip("/")),
                  ssl_context=ssl.create_default_context(), timeout=12)
              with conn.cursor() as cur:
                  cur.execute("SELECT 1")
                  print("PG8000: connected, SELECT_1_OK")
              conn.close()
          except Exception as exc:
              msg = str(exc).lower()
              if "password" in msg or "authentication" in msg:
                  category = "authentication"
              elif "ssl" in msg or "tls" in msg:
                  category = "tls"
              elif "timeout" in msg or "timed out" in msg:
                  category = "timeout"
              elif "connection" in msg:
                  category = "connection"
              else:
                  category = "other"
              print("PG8000: failed", type(exc).__name__, category)
          PY
      - name: Send 39 personal thank-you letters once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python tools/send_election_voter_letters_20261018.py --send
