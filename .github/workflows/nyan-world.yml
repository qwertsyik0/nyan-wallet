name: NYAN WORLD checks
on:
  push:
    paths: ['server/nyan_world.py', 'server/world_news*', 'tools/*world_news*', 'tools/test_nyan_world.py', 'tools/install_nyan_world.py', 'tools/test_install_nyan_world.py', 'nyan-world*', 'tools/test_nyan_world_ui.cjs', 'tools/test_nyan_world_rules.cjs', 'tools/test_nyan_world_entry.cjs', 'tools/test_nyan_world_country_info.cjs', 'tools/test_nyan_world_invite.cjs', 'tools/test_nyan_world_news.cjs', 'assets/nyan-world/**', '.github/workflows/nyan-world.yml']
  pull_request:
    paths: ['server/nyan_world.py', 'server/world_news*', 'tools/*world_news*', 'tools/test_nyan_world.py', 'tools/install_nyan_world.py', 'nyan-world*', '.github/workflows/nyan-world.yml']
permissions:
  contents: read
jobs:
  world:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: world
          POSTGRES_PASSWORD: world_test_password
          POSTGRES_DB: world_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install 'SQLAlchemy==2.0.43' 'fastapi==0.115.12' 'httpx==0.28.1' 'psycopg[binary]==3.2.9'
      - run: python -m py_compile server/nyan_world.py tools/install_nyan_world.py
      - run: node --check nyan-world.js
      - run: node --check nyan-world-entry.js
      - run: python tools/test_nyan_world.py
      - name: Verify PostgreSQL and concurrent retries
        run: python tools/test_nyan_world.py
        env:
          NYAN_WORLD_TEST_DATABASE_URL: postgresql+psycopg://world:world_test_password@localhost:5432/world_test
      - name: Install isolated DOM test dependency
        run: npm install --prefix /tmp/world-ui jsdom@26
      - name: Test owner and player UI flows
        run: node tools/test_nyan_world_ui.cjs
        env:
          NODE_PATH: /tmp/world-ui/node_modules
      - name: Test additive VPS install and rollback
        run: python tools/test_install_nyan_world.py
      - name: Test World card placement
        run: node tools/test_nyan_world_entry.cjs
        env:
          NODE_PATH: /tmp/world-ui/node_modules
      - name: Validate event information and invite scripts
        run: |
          node --check nyan-world-invite.js
          node --check nyan-world-info.js
      - name: Test event invite lifecycle and information page
        run: node tools/test_nyan_world_invite.cjs
        env:
          NODE_PATH: /tmp/world-ui/node_modules
      - name: Test country information and older WebView dialogs
        run: node tools/test_nyan_world_country_info.cjs
        env:
          NODE_PATH: /tmp/world-ui/node_modules

      - name: Test mandatory rules prompt and rules page
        run: |
          node --check nyan-world-rules.js
          node tools/test_nyan_world_rules.cjs
        env:
          NODE_PATH: /tmp/world-ui/node_modules

      - name: Test first news briefing
        run: |
          node --check nyan-world-news.js
          node tools/test_nyan_world_news.cjs
        env:
          NODE_PATH: /tmp/world-ui/node_modules
      - name: Test news editor permissions and publication
        run: |
          python tools/test_world_news_editor.py
          python tools/test_install_world_news_editor.py
          node --check nyan-world-news-editor.js
          node tools/test_world_news_editor_ui.cjs
          node tools/test_world_news_feed_ui.cjs
        env:
          NODE_PATH: /tmp/world-ui/node_modules
      - name: Test news editor on PostgreSQL
        run: python tools/test_world_news_editor.py
        env:
          NYAN_WORLD_TEST_DATABASE_URL: postgresql+psycopg://world:world_test_password@localhost:5432/world_test

