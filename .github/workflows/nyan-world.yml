name: NYAN WORLD checks
on:
  push:
    paths: ['server/nyan_world.py', 'tools/test_nyan_world.py', 'tools/install_nyan_world.py', 'nyan-world*', '.github/workflows/nyan-world.yml']
  pull_request:
    paths: ['server/nyan_world.py', 'tools/test_nyan_world.py', 'tools/install_nyan_world.py', 'nyan-world*', '.github/workflows/nyan-world.yml']
permissions:
  contents: read
jobs:
  world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install 'SQLAlchemy==2.0.43' 'fastapi==0.115.12' 'httpx==0.28.1'
      - run: python -m py_compile server/nyan_world.py tools/install_nyan_world.py
      - run: node --check nyan-world.js
      - run: node --check nyan-world-entry.js
      - run: python tools/test_nyan_world.py
