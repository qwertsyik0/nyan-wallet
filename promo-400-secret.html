<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nyan Wallet · ???</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html,body { margin:0; min-height:100%; background:#070609; color:#fff; }
    body {
      min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px 18px;
      background:
        radial-gradient(circle at 50% 35%, rgba(168, 36, 95, .20), transparent 24%),
        radial-gradient(circle at 50% 80%, rgba(104, 39, 100, .12), transparent 32%),
        #070609;
    }
    .box { width:min(100%,430px); text-align:center; }
    .signal {
      width:64px; height:64px; margin:0 auto 26px; border:1px solid rgba(255,255,255,.11);
      border-radius:50%; display:grid; place-items:center; color:#d95890; font-size:26px;
      box-shadow:0 0 40px rgba(217,88,144,.12);
      animation:pulse 2s ease-in-out infinite;
    }
    .kicker { color:#8e697a; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:14px 0 0; font-size:clamp(31px,9vw,44px); line-height:1.03; letter-spacing:-.045em; }
    p { margin:15px auto 0; max-width:340px; color:#b49aa7; font-size:15px; line-height:1.62; }
    .reward {
      display:inline-flex; gap:7px; align-items:center; margin-top:27px; padding:11px 16px;
      border:1px solid rgba(217,88,144,.16); border-radius:999px; background:rgba(217,88,144,.06);
      color:#e9c6d5; font-size:13px; font-weight:800;
    }
    .hint { margin-top:34px; color:#6e5963; font-size:12px; line-height:1.5; }
    .dots { margin-top:30px; color:#8e4767; letter-spacing:.55em; animation:blink 1.6s steps(2,end) infinite; }
    @keyframes pulse { 50% { transform:scale(1.06); box-shadow:0 0 58px rgba(217,88,144,.20); } }
    @keyframes blink { 50% { opacity:.35; } }
  </style>
</head>
<body>
  <main class="box">
    <div class="signal">?</div>
    <div class="kicker">соединение установлено</div>
    <h1>а ты готов раскрыть тайну и получить больше?</h1>
    <p>это была только первая часть. следи за событиями в Nyan Wallet. скоро появится то, что изменит значение цифры <strong>400</strong>.</p>
    <div class="reward" id="reward">+50 🐾 уже на балансе</div>
    <div class="dots">•••</div>
    <div class="hint">не закрывай для себя эту историю слишком рано.</div>
  </main>
  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      tg?.ready?.();
      tg?.expand?.();
      tg?.MainButton?.hide?.();

      const used = new URL(location.href).searchParams.get("used") === "1";
      if (used) {
        document.getElementById("reward").textContent = "этот сигнал вы уже получали";
      }
    })();
  </script>
</body>
</html>
