<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Nyan Wallet · Сезон 777</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08070a;color:#fff}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 8%,rgba(180,42,99,.18),transparent 28%),linear-gradient(180deg,#100a0f,#070608 70%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.018) 50%,transparent 85%);animation:scan 7s linear infinite}
.wrap{width:min(100%,520px);margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px max(38px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-size:13px;font-weight:900;letter-spacing:.04em}.season{color:#b97894;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.progress{display:flex;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#38232e}.dot.on{background:#ce4c85;box-shadow:0 0 14px rgba(206,76,133,.5)}
.card{border:1px solid rgba(255,117,173,.13);border-radius:28px;background:rgba(19,12,17,.9);box-shadow:0 25px 70px rgba(0,0,0,.35);overflow:hidden}
.inner{padding:24px}.glitch{font-size:10px;font-weight:900;letter-spacing:.17em;color:#d36392;text-transform:uppercase}
h1{margin:10px 0 0;font-size:clamp(30px,8vw,44px);line-height:1.02;letter-spacing:-.045em}
.copy{margin-top:14px;color:#bca4af;font-size:14px;line-height:1.62}.copy strong{color:#f3d6e3}
.terminal{margin-top:20px;padding:16px;border:1px solid rgba(255,255,255,.065);border-radius:18px;background:#08070a;color:#d9c2cc;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.65;white-space:pre-line}
.actions{display:grid;gap:9px;margin-top:20px}
.choice{width:100%;min-height:54px;padding:13px 15px;border:1px solid rgba(255,255,255,.075);border-radius:17px;background:rgba(255,255,255,.035);color:#f6eaf0;text-align:left;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.choice:hover,.choice:active{border-color:rgba(220,77,139,.4);background:rgba(220,77,139,.08)}
.choice.secret{border-color:rgba(220,77,139,.28);background:rgba(220,77,139,.075)}
.choice:disabled{opacity:.45;cursor:default}
.note{margin-top:18px;color:#765f69;font-size:11px;line-height:1.45;text-align:center}
.wait{padding:34px 24px;text-align:center}.clock{font-size:44px;margin-bottom:12px}.wait h2{margin:0;font-size:27px}.wait p{color:#a98e9a;line-height:1.55;font-size:14px}
.result{text-align:center;padding:30px 24px}.reward{font-size:58px;font-weight:950;letter-spacing:-.06em;color:#ffd4e6}.achievement{display:inline-block;margin-top:15px;padding:8px 12px;border:1px solid rgba(211,76,135,.2);border-radius:999px;background:rgba(211,76,135,.07);color:#e7b7cb;font-size:12px;font-weight:800}
.error{padding:18px;color:#e59fab;font-size:13px;text-align:center}.hidden{display:none!important}
@keyframes scan{0%{transform:translateX(-45%)}100%{transform:translateX(45%)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="brand">Nyan Wallet</div><div class="season">сезон 777</div></div>
    <div id="progress" class="progress"></div>
  </div>
  <section class="card"><div id="app" class="inner"><div class="copy">загружаем архив…</div></div></section>
  <div class="note">решения сохраняются и не могут быть изменены после подтверждения</div>
</div>
<script>
(()=>{
"use strict";
const tg=window.Telegram?.WebApp,API="https://nyan-wallet-api.onrender.com",app=document.getElementById("app"),progress=document.getElementById("progress");\nlet savedInitData="";try{savedInitData=sessionStorage.getItem("nyan_tg_init_data")||""}catch(_){}\nconst effectiveInitData=()=>tg?.initData||savedInitData||"";
tg?.ready?.();tg?.expand?.();tg?.BackButton?.show?.();tg?.BackButton?.onClick?.(()=>{location.href="./"+location.search+location.hash});

function headers(json=false){const h={"X-Telegram-Init-Data":effectiveInitData()};if(json)h["Content-Type"]="application/json";return h}
async function read(r){try{return await r.json()}catch(_){return {}}}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function dots(s){const vals=[s.chapter1_choice,s.chapter2_choice,s.chapter3_choice,s.final_choice];progress.innerHTML=vals.map((v,i)=>'<span class="dot '+(v?'on':'')+'"></span>').join("")}
function when(v){if(!v)return"";try{return new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}).format(new Date(v))}catch(_){return v}}
function choices(items,step,secret=false){return '<div class="actions">'+items.map(([id,label])=>'<button class="choice '+(secret&&id==="nobody"?'secret':'')+'" data-step="'+step+'" data-choice="'+id+'">'+label+'</button>').join("")+'</div>'}
function chapter1(){
app.innerHTML='<div class="glitch">ошибка синхронизации</div><h1>кошелёк, которого не существует</h1><div class="terminal">КОШЕЛЁК: NYAN 0000 0000 0000\nВЛАДЕЛЕЦ: ███████\nБАЛАНС: 777 🐾\n\nпоследняя операция: -777 🐾\nстатус: ОТМЕНЕНО</div><div class="copy">сумма вернулась обратно, но владелец больше ни разу не открыл кошелёк. что проверим первым?</div>'+choices([["owner","посмотреть информацию о владельце"],["transfer","проверить отменённый перевод"],["greed","попробовать забрать 777 🐾"]],"chapter1");
}
function chapter2(){
app.innerHTML='<div class="glitch">глава II · 1 лапкоин</div><h1>архив изменился</h1><div class="terminal">БАЛАНС: 776 🐾\n\n-1 🐾\nполучатель: NYAN 0714 0211 0318\nстатус: ДОСТАВЛЕНО</div><div class="copy">вчера этого кошелька не существовало. сейчас он зарегистрирован без имени владельца.</div>'+choices([["contact","отправить туда ещё 1 🐾"],["watch","ничего не отправлять и наблюдать"],["admin","пожаловаться администрации"]],"chapter2");
}
function chapter3(){
app.innerHTML='<div class="glitch">глава III · кто лжёт</div><h1>две версии</h1><div class="terminal">НЕИЗВЕСТНЫЙ:\n«я сообщил об ошибке. после этого меня удалили.»\n\nСИСТЕМА:\n«объект 00000001 создал незаконно 14 280 🐾.»</div><div class="copy">в архиве, который ты видел раньше, никаких 14 280 🐾 не было. кому верить?</div>'+choices([["system","поверить системе"],["unknown","поверить неизвестному"],["logs","проверить журнал изменений"]],"chapter3");
}
function finale(canSecret){
const base=[["mine","отправить 777 🐾 мне"],["return","вернуть их системе"],["split","разделить между всеми"]];
if(canSecret)base.push(["nobody","никому"]);
app.innerHTML='<div class="glitch">финал · NYAN-0</div><h1>последняя операция</h1><div class="copy">«я не человек. я — первая тестовая версия системы начислений. мне осталось выполнить одну операцию.»</div><div class="terminal">777 🐾 должны получить владельца.\n\nкому их отправить?</div>'+choices(base,"final",canSecret);
}
function waiting(s){
app.innerHTML='<div class="wait"><div class="clock">◷</div><h2>архив пока молчит</h2><p>следующая запись откроется <strong>'+esc(when(s.waiting_until))+'</strong>.<br>возвращайся позже — предыдущие решения уже сохранены.</p></div>';
}
function complete(s,c){
const names={season777_truth:"Ошибка №777",season777_collective:"На всех",season777_archivist:"Архивариус",season777_greed:"А вдруг прокатит?",season777_owner:"Новый владелец"};
let extra="";
if(s.achievement_key==="season777_truth") extra='<div class="copy">«правильно. 777 — не баланс. это номер теста.»<br><br>ТЕСТ №777 ЗАВЕРШЁН.</div>';
else if(s.achievement_key==="season777_collective") extra='<div class="copy">ты выбрал общий фонд. сейчас таких решений: <strong>'+esc(c.split_endings)+'</strong>.</div>';
app.innerHTML='<div class="result"><div class="glitch">сезон завершён</div><h1>'+esc(names[s.achievement_key]||"финал")+'</h1>'+extra+'<div class="reward">+'+esc(s.reward_amount)+' 🐾</div><div class="achievement">достижение: '+esc(names[s.achievement_key]||"Сезон 777")+'</div><div class="copy">награда уже начислена на баланс.</div></div>';
}
function render(d){
const s=d.state||{},e=d.event||{};dots(s);
if(s.completed){complete(s,d.community||{});return}
if(e.status==="ended"){app.innerHTML='<div class="wait"><div class="clock">×</div><h2>архив закрыт</h2><p>сезон уже завершён.</p></div>';return}
if(e.status==="upcoming"||(!s.current_step&&s.waiting_until)){waiting(s);return}
if(s.current_step==="chapter1")chapter1();
else if(s.current_step==="chapter2")chapter2();
else if(s.current_step==="chapter3")chapter3();
else if(s.current_step==="final")finale(Boolean(s.can_secret));
else waiting(s);
}
async function load(){
if(!effectiveInitData()){app.innerHTML='<div class="error">открой сезон через Telegram Mini App.</div>';return}
try{const r=await fetch(API+"/api/season-777/status",{headers:headers(),cache:"no-store"});const d=await read(r);if(!r.ok)throw new Error(d?.detail||"не удалось открыть архив");render(d)}
catch(e){app.innerHTML='<div class="error">'+esc(e?.message||"ошибка загрузки")+'</div>'}
}
async function pick(step,choice,button){
document.querySelectorAll(".choice").forEach(b=>b.disabled=true);button.textContent="сохраняем выбор…";
try{const r=await fetch(API+"/api/season-777/choice",{method:"POST",headers:headers(true),body:JSON.stringify({step,choice})});const d=await read(r);if(!r.ok)throw new Error(d?.detail||"не удалось сохранить выбор");tg?.HapticFeedback?.selectionChanged?.();render(d)}
catch(e){app.insertAdjacentHTML("beforeend",'<div class="error">'+esc(e?.message||"ошибка")+'</div>');document.querySelectorAll(".choice").forEach(b=>b.disabled=false)}
}
document.addEventListener("click",e=>{const b=e.target.closest(".choice");if(!b)return;pick(b.dataset.step,b.dataset.choice,b)});
load();
})();
</script>
</body>
</html>
